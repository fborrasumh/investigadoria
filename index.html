<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f7f5; --surface: #fff; --border: #e4e3df; --border-strong: #cccbc6;
  --text: #1a1916; --muted: #7a7872; --accent: #1a4fd8;
  --s2: #1a4fd8; --s3: #126649; --s4: #6429a8; --s5: #c2186b;
}
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
a { color: var(--accent); }

/* HEADER */
header { background: #1a1916; color: #fff; padding: 56px 24px 48px; text-align: center; position: relative; }
.lang-toggle { position: absolute; top: 16px; right: 16px; display: inline-flex; border: 1px solid #3a3934; border-radius: 99px; overflow: hidden; }
.lang-toggle button { background: transparent; color: #888; border: 0; font: 600 12px/1 'Inter', sans-serif; letter-spacing: .06em; padding: 7px 11px; cursor: pointer; }
.lang-toggle button.active { background: #fff; color: #1a1916; }
.org { display: inline-block; margin-bottom: 28px; background: #fff; border-radius: 12px; padding: 12px 18px; }
.org img { height: 72px; width: auto; display: block; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #777; margin-bottom: 14px; }
h1 { font-family: 'Sora', sans-serif; font-size: clamp(2rem, 4.6vw, 3.1rem); font-weight: 800; line-height: 1.1; letter-spacing: -.03em; margin: 0 auto 14px; max-width: 820px; }
h1 span { color: #6b8fff; }
.sub { font-size: 1rem; color: #aaa; max-width: 600px; margin: 0 auto 30px; }
.stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
.stat-n { font-family: 'Sora', sans-serif; font-size: 1.8rem; font-weight: 800; }
.stat-l { font-size: .75rem; color: #777; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }

/* NAV */
nav { position: sticky; top: 0; z-index: 5; background: rgba(247,247,245,.94); backdrop-filter: blur(6px); border-bottom: .5px solid var(--border); }
nav .in { max-width: 1060px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 6px; flex-wrap: wrap; }
nav a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 99px; border: .5px solid transparent; }
nav a:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface); }

/* MAIN */
main { max-width: 1060px; margin: 0 auto; padding: 40px 24px 80px; }
section { margin-bottom: 56px; scroll-margin-top: 64px; }
h2 { font-family: 'Sora', sans-serif; font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
.lead { color: var(--muted); margin-bottom: 22px; max-width: 760px; }

/* APP CARDS, AGRUPADAS POR SESIÓN */
.sgroup { margin-bottom: 28px; }
.sgroup h3 { font-family: 'Sora', sans-serif; font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; color: var(--c); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: .5px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--c); }
.card-h { display: flex; align-items: center; gap: 12px; }
.icon-box { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; background: var(--c); flex-shrink: 0; }
.card h4 { font-family: 'Sora', sans-serif; font-size: 1.2rem; font-weight: 800; }
.card p { font-size: 14px; color: #444; }
.card .chk { font-size: 13px; color: #555; background: #faf9f7; border-radius: 8px; padding: 10px 12px; }
.card .chk b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
.card .foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-top: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 13px 'Inter', sans-serif; padding: 7px 14px; border-radius: 99px; text-decoration: none; background: var(--c); color: #fff; }
.shared { margin-top: 4px; font-size: 14px; color: #555; background: var(--surface); border: .5px solid var(--border); border-radius: 12px; padding: 14px 18px; }

/* FRANJA DE FASES */
:root { --comp: #b45309; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i.sw { width: 14px; height: 14px; border-radius: 4px; background: var(--c); display: inline-block; }
.legend i.sw.comp { background: #fff; border: 1.5px dashed var(--comp); }
.phases-wrap { width: min(1400px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); overflow-x: auto; padding-bottom: 6px; }
.phases { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 10px; min-width: 1240px; }
.phase { background: var(--surface); border: .5px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.phase-h { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; border-bottom: .5px solid var(--border); }
.phase-n { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--muted); }
.phase-t { font-family: 'Sora', sans-serif; font-weight: 700; font-size: .9rem; line-height: 1.25; }
.chip { display: block; text-decoration: none; border-radius: 10px; padding: 9px 11px; font-size: 12.5px; line-height: 1.35; position: relative; }
.chip b { display: block; font-family: 'Sora', sans-serif; font-size: 13.5px; margin-bottom: 2px; padding-right: 34px; }
.chip .tag { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 600; letter-spacing: .04em; border-radius: 99px; padding: 1px 6px; }
.chip.ses { background: var(--c); color: #fff; }
.chip.ses .tag { background: rgba(255,255,255,.22); }
.chip.comp { background: #fff; border: 1.5px dashed var(--comp); color: #444; }
.chip.comp b { color: var(--comp); }
.chip.comp .tag { background: #fdf3e7; color: var(--comp); }
.chip:hover { filter: brightness(.95); }
.phases-note { margin-top: 12px; font-size: 13px; color: var(--muted); }
.vs-h { font-family: 'Sora', sans-serif; font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; }
.vs .box.api { border: 1.5px solid var(--accent); }
.vs .box.api h3 { color: var(--accent); }
.vs-note { margin: 10px 0 26px; }

/* SESSIONS */
.sessions { background: var(--surface); border: .5px solid var(--border); border-radius: 12px; overflow: hidden; }
.srow { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 16px; padding: 16px 18px; border-bottom: .5px solid var(--border); align-items: start; font-size: 14px; }
.srow:last-child { border-bottom: 0; }
.srow.head { background: #faf9f7; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 18px; }
.snum { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--c, var(--text)); }
.stit { font-weight: 600; }
.sapp { font-size: 12px; color: var(--muted); }
.slink { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 13px; font-weight: 600; text-decoration: none; }

/* STEPS / RULES */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.box { background: var(--surface); border: .5px solid var(--border); border-radius: 12px; padding: 20px 22px; }
.box h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
ol, ul { padding-left: 20px; font-size: 14px; color: #444; }
li { margin-bottom: 7px; }
.prov { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.prov a { font-size: 13px; text-decoration: none; border: .5px solid var(--border-strong); border-radius: 99px; padding: 5px 12px; color: var(--text); background: #faf9f7; }
.prov a:hover { border-color: var(--accent); }

/* FOOTER */
footer { background: var(--surface); border-top: .5px solid var(--border); padding: 28px 24px; text-align: center; font-size: 13px; color: var(--muted); }
footer p + p { margin-top: 6px; }
footer a { text-decoration: none; }

a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 720px) {
  .srow { grid-template-columns: 40px 1fr; }
  .srow .hide-sm { display: none; }
  .lang-toggle { top: 10px; right: 10px; }
  .lang-toggle button { padding: 6px 8px; }
  header { padding-top: 64px; }
}
</style>
</head>

];

es:{
  eyebrow:"Curso · Formación ISABIAL",
  h1:"Herramientas de IA para <span>la investigación</span>",
  sub:"Doce apps web de un solo archivo, con tu propia clave de IA, para buscar la evidencia, financiar el proyecto, analizar los datos y publicar.",
  stApps:"apps", stSes:"sesiones", stHours:"de formación", stLangs:"idiomas",
  navApps:"Apps", navCourse:"Curso", navKey:"Clave de IA", navRules:"Normas de uso",
  appsH:"Las doce apps",
  appsLead:"Cada app funciona en el navegador, sin instalación ni servidor. Funcionan con OpenAI, Google Gemini o Anthropic Claude. La IA propone y el código comprueba.",

  shared:"Cada participante trabaja sobre su propio proyecto y cada sesión parte de lo producido en la anterior: el estado del arte de la sesión 2 sostiene la memoria de la sesión 3, y el cuaderno ejecutado de CuadernIA es la entrada de NarrativIA.",
  apps:{

en:{
  eyebrow:"Course · ISABIAL Training",
  h1:"AI tools for <span>research</span>",
  sub:"Twelve single-file web apps, with your own AI key, to find the evidence, fund the project, analyse the data and publish.",
  stApps:"apps", stSes:"sessions", stHours:"of training", stLangs:"languages",
  navApps:"Apps", navCourse:"Course", navKey:"AI key", navRules:"Rules of use",
  appsH:"The twelve apps",
  appsLead:"Each app runs in the browser, with no installation or server. They work with OpenAI, Google Gemini or Anthropic Claude. The AI proposes and the code checks.",
  checks:"What is checked", open:"Open app", session:"Session",
  shared:"Each participant works on their own project and every session builds on the previous one: the state of the art from session 2 supports the proposal in session 3, and the executed CuadernIA notebook is the input for NarrativIA.",
  apps:{
    publication_radar:{ what:"Type your topic and find out which journals actually publish on it; choose the ones to follow and browse their new articles, with DOI and export to Zotero.", chk:"Every article comes from OpenAlex and PubMed: the AI never generates references. Each journal is backed by its number of articles on the topic." },
    doctoralia:{ what:"State-of-the-art review from six scientific databases, with a PRISMA diagram and a bibliography ready for the manuscript or the proposal.", chk:"Every citation is anchored to a real paper and verified in the browser; the citation audit flags those that do not hold." },
    prismia:{ what:"Systematic review with three models from different providers: two screen blindly by title and abstract and by full text, and a third arbitrates only the disagreements. Searches PubMed and OpenAlex or imports RIS and CSV.", chk:"The code computes kappa and the PRISMA diagram, checks that every extracted quote appears in the text and computes the overall risk-of-bias judgement (RoB 2, ROBINS-I, QUADAS-2, Newcastle-Ottawa)." },
    fronteria:{ what:"From your question to a research proposal: agents find the limitations of the state of the art, propose ideas, design the study and submit it to a simulated reviewer. Downloads as Word.", chk:"The novelty of each idea is checked against the most similar OpenAlex publications; the code picks the most novel approved idea; references not found are marked ⚠ and left out of the bibliography." },
    grantwriter:{ what:"Project proposals for R&D calls (AEI, CDTI, Horizon Europe, IVACE and more): nine agents search the literature, set the strategy according to the evaluation criteria and write each section.", chk:"References come from six scientific databases; citations that do not exist and figures not found in your input are flagged; anything missing is left as [COMPLETAR]." },
    subvencia:{ what:"Upload the call and the project; it extracts the evaluation rubric, scores the project and improves it in cycles towards the maximum.", chk:"Each criterion carries its quote from the call; the code adds up the total score with the call's weights; a change is kept only if the score rises; nothing invented ([COMPLETAR] marks)." },
    cuadernia:{ what:"From a CSV or Excel file and a study description, it proposes an editable analysis plan and generates a Jupyter notebook with descriptive, inferential and modelling analysis (pandas, scipy, statsmodels).", chk:"Variables are profiled by code in the browser and the analysis plan is reviewed before any code is written." },
    narrativia:{ what:"Turns the executed notebook into the Results section: it inventories tables, figures and tests in execution order and writes the scientific prose.", chk:"Tables are built with the exact notebook values and every figure in the text is audited against its outputs; unsupported numbers are flagged." },
    refinia:{ what:"Reviews the manuscript passage by passage with several lenses in parallel (data, method and statistics, internal consistency, references and argument) and cross-checks the sections.", chk:"Each comment is anchored to its exact quote in the text, with severity and a suggested fix; findings that do not hold are filtered out." },
    revistafit:{ what:"Searches OpenAlex for where literature similar to your manuscript is published, ranks journals by your priorities (topical fit, impact, open access, cost) and drafts the cover letter.", chk:"Each recommendation is backed by the specific OpenAlex articles published in that journal." },
    adaptia:{ what:"Extracts an editorial profile from the author guidelines, compares the manuscript and proposes only the necessary changes as a diff you accept or reject.", chk:"Each profile rule carries its quote from the guidelines; an auditor flags by code new figures, more categorical claims and altered citations." },
    arbitria:{ what:"Simulates the full review at an international journal: five reviewers with different roles and an editorial synthesis with a decision and a revision roadmap.", chk:"Reviewers work without seeing each other's reports; every finding carries its evidence anchor and severity, with no numerical score." }
  },

pt:{
  eyebrow:"Curso · Formação ISABIAL",
  h1:"Ferramentas de IA para <span>a investigação</span>",
  sub:"Doze aplicações web de um só ficheiro, com a tua própria chave de IA, para procurar a evidência, financiar o projeto, analisar os dados e publicar.",
  stApps:"apps", stSes:"sessões", stHours:"de formação", stLangs:"idiomas",
  navApps:"Apps", navCourse:"Curso", navKey:"Chave de IA", navRules:"Normas de utilização",
  appsH:"As doze apps",
  appsLead:"Cada app funciona no navegador, sem instalação nem servidor. Funcionam com OpenAI, Google Gemini ou Anthropic Claude. A IA propõe e o código verifica.",
  checks:"O que se verifica", open:"Abrir app", session:"Sessão",
  shared:"Cada participante trabalha sobre o seu próprio projeto e cada sessão parte do que foi produzido na anterior: o estado da arte da sessão 2 sustenta a candidatura da sessão 3, e o caderno executado do CuadernIA é a entrada do NarrativIA.",
  apps:{
    publication_radar:{ what:"Escreve o teu tema e descobre em que revistas se publica de facto; escolhe as que queres seguir e consulta os seus artigos novos, com DOI e exportação para o Zotero.", chk:"Todos os artigos provêm do OpenAlex e do PubMed: a IA nunca gera referências. Cada revista traz como prova o seu número de artigos sobre o tema." },
    doctoralia:{ what:"Revisão do estado da arte a partir de seis bases científicas, com diagrama PRISMA e bibliografia pronta para o manuscrito ou a candidatura.", chk:"Cada citação fica ancorada a um artigo real e é verificada no navegador; a auditoria de citações assinala as que não se sustentam." },
    prismia:{ what:"Revisão sistemática com três modelos de fornecedores distintos: dois fazem a triagem às cegas por título e resumo e por texto completo, e um terceiro arbitra apenas os desacordos. Pesquisa no PubMed e no OpenAlex ou importa RIS e CSV.", chk:"O código calcula o kappa e o diagrama PRISMA, verifica que cada citação da extração aparece no texto e calcula o juízo global de risco de viés (RoB 2, ROBINS-I, QUADAS-2, Newcastle-Ottawa)." },
    fronteria:{ what:"Da tua pergunta a uma proposta de investigação: os agentes procuram as limitações do estado da arte, propõem ideias, desenham o estudo e submetem-no a um revisor simulado. Descarrega-se em Word.", chk:"A novidade de cada ideia é contrastada com as publicações mais parecidas do OpenAlex; o código escolhe a mais inovadora das aprovadas; as referências não encontradas são marcadas com ⚠ e ficam fora da bibliografia." },
    grantwriter:{ what:"Candidaturas a concursos de I&D&I (AEI, CDTI, Horizonte Europa, IVACE e outros): nove agentes procuram bibliografia, definem a estratégia segundo os critérios de avaliação e redigem cada secção.", chk:"As referências vêm de seis bases científicas; assinalam-se as citações que não existem e os números que não constam do que forneceste; o que falta fica como [COMPLETAR]." },
    subvencia:{ what:"Carrega o concurso e o projeto; extrai a rubrica de avaliação, pontua o projeto e melhora-o em ciclos até o aproximar do máximo.", chk:"Cada critério traz a sua citação do regulamento; a pontuação total é somada pelo código com os pesos do concurso; uma alteração só se mantém se a pontuação subir; nada inventado (marcas [COMPLETAR])." },
    cuadernia:{ what:"A partir de um CSV ou Excel e da descrição do estudo, propõe um plano de análise editável e gera um caderno Jupyter com análise descritiva, inferencial e modelação (pandas, scipy, statsmodels).", chk:"As variáveis são perfiladas por código no navegador e o plano de análise é revisto antes de escrever o código." },
    narrativia:{ what:"Converte o caderno já executado na secção de Resultados: inventaria tabelas, figuras e testes pela ordem de execução e redige a prosa científica.", chk:"As tabelas são construídas com os valores exatos do caderno e cada número do texto é auditado face às suas saídas; os números sem suporte são assinalados." },
    refinia:{ what:"Revê o manuscrito passagem a passagem com várias lentes em paralelo (dados, método e estatística, consistência interna, referências e argumentação) e contrasta as secções entre si.", chk:"Cada comentário fica ancorado à sua citação exata no texto, com gravidade e sugestão de correção; os achados que não se sustentam são filtrados." },
    revistafit:{ what:"Procura no OpenAlex onde se publica a literatura semelhante ao teu manuscrito, ordena as revistas segundo as tuas prioridades (ajuste temático, impacto, acesso aberto, custo) e redige a carta de apresentação.", chk:"Cada recomendação é justificada com os artigos concretos do OpenAlex publicados nessa revista." },
    adaptia:{ what:"Extrai das normas para autores um perfil editorial, compara o manuscrito e propõe apenas as alterações necessárias com um diff que aceitas ou rejeitas.", chk:"Cada regra do perfil traz a sua citação das normas; um auditor assinala por código os números novos, as afirmações mais categóricas e as citações alteradas." },
    arbitria:{ what:"Simula a revisão completa de uma revista internacional: cinco revisores com papéis distintos e uma síntese editorial com decisão e roteiro de revisão.", chk:"Os revisores trabalham sem ver os relatórios dos outros; cada achado traz a sua âncora de evidência e a sua gravidade, sem pontuação numérica." }
  },

    { t:"Procurar e sintetizar a evidência", a:"Publication Radar · Doctoralia · PRISMIA", o:"Radar de revistas da área, estado da arte com citações verificadas e triagem de teste com o seu diagrama PRISMA." },
    { t:"Financiamento de projetos", a:"FronterIA · GrantWriter · SubvencIA", o:"Proposta com a novidade contrastada e candidatura a um concurso real, pontuada com a sua rubrica e com o relatório de ciclos." },
    { t:"Dos dados ao manuscrito", a:"CuadernIA · NarrativIA · RefinIA", o:"Caderno executado, secção de Resultados com os números auditados e relatório de verificação do manuscrito." },
    { t:"Do manuscrito à revista", a:"RevistaFit · AdaptIA · ArbitrIA", o:"Revista escolhida com a carta de apresentação, manuscrito adaptado às suas normas, simulação de revisão com roteiro e apresentação final ao grupo." }
  ],
  keyH:"A tua chave de IA",
  keyLead:"As apps usam a API do fornecedor com a tua própria chave. A chave é guardada apenas no teu navegador e nunca passa por um servidor do curso.",
  keyStepsH:"Criar a chave com limite de gastos",
  keySteps:[
    "Cria uma conta na plataforma de programadores do fornecedor (no curso, platform.openai.com).",
    "Adiciona um método de pagamento e define um limite de gastos mensal baixo antes de criar a chave.",

let lang = "es";

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = L[el.dataset.i18nHtml]; });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("active", b.dataset.l === lang));

  document.getElementById("legend").innerHTML =
    [2,3,4,5].map(n => `<span style="--c:var(${SES_COLOR[n]})"><i class="sw"></i>${esc(L.legSes)} ${n}</span>`).join("") +
    `<span><i class="sw comp"></i>${esc(L.legComp)}</span>`;
  document.getElementById("phases").innerHTML = PHASES.map((ids, i) => `<div class="phase">
      <div class="phase-h"><span class="phase-n">${i+1}</span><span class="phase-t">${esc(L.phases[i])}</span></div>
      ${ids.map(id => {
        const a = APPS.find(x => x.id === id);
        const url = `https://fborrasumh.github.io/${id}/`;
        return a
          ? `<a class="chip ses" style="--c:var(${SES_COLOR[a.ses]})" href="${url}" target="_blank" rel="noopener"><span class="tag">S${a.ses}</span><b>${esc(a.name)}</b>${esc(L.short[id])}</a>`
          : `<a class="chip comp" href="${url}" target="_blank" rel="noopener"><span class="tag">${esc(L.tagComp)}</span><b>${esc(COMP[id])}</b>${esc(L.short[id])}</a>`;
      }).join("")}
    </div>`).join("");

  document.getElementById("groups").innerHTML = [2,3,4,5].map(n => {
    const cards = APPS.filter(a => a.ses === n).map(a => {
      const A = L.apps[a.id];
      const url = `https://fborrasumh.github.io/${a.id}/`;
      return `<article class="card">
        <div class="card-h"><div class="icon-box"><i class="ti ${a.icon}"></i></div><h4>${a.name}</h4></div>
        <p>${esc(A.what)}</p>
        <div class="chk"><b>${esc(L.checks)}</b>${esc(A.chk)}</div>
        <div class="foot"><a class="btn" href="${url}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i> ${esc(L.open)}</a></div>
      </article>`;
    }).join("");
    return `<div class="sgroup" style="--c:var(${SES_COLOR[n]})"><h3>${esc(L.session)} ${n} · ${esc(L.sessions[n-1].t)}</h3><div class="grid">${cards}</div></div>`;
  }).join("");

  document.getElementById("sessions").innerHTML =
    `<div class="srow head"><div></div><div>${esc(L.thSes)}</div><div class="hide-sm">${esc(L.thOut)}</div></div>` +
    L.sessions.map((s,i) => `<div class="srow" style="--c:var(${SES_COLOR[i+1]})">
      <div class="snum">${i+1}</div>
      <div><div class="stit">${esc(s.t)}</div><div class="sapp">${esc(s.a)}</div>${i === 0 ? `<a class="slink" href="sesion1/"><i class="ti ti-presentation"></i> ${esc(L.slides)}</a>` : ""}</div>
      <div class="hide-sm">${esc(s.o)}</div>
    </div>`).join("");

  const list = (id, arr) => { document.getElementById(id).innerHTML = arr.map(x => `<li>${esc(x)}</li>`).join(""); };
  list("chatL", L.chat); list("apiL", L.api); list("keySteps", L.keySteps); list("keyChoose", L.keyChoose); list("priv", L.priv); list("eth", L.eth);
}

function setLang(l){
  lang = l;
  try { localStorage.setItem("isabial-lang", l); } catch(e) {}
  render();
}

document.getElementById("langs").innerHTML = LANGS.map(l => `<button data-l="${l}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
try {
  const saved = localStorage.getItem("isabial-lang");
  lang = LANGS.includes(saved) ? saved : "es";
} catch(e) {}
render();
</script>
